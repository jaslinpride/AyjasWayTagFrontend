<!DOCTYPE html>
<html>
<head><title>Save Location</title></head>
<body>
  <h2>Save Location</h2>
  <form id="location-form">
    <input type="text" id="name" placeholder="Name" required /><br />
    <input type="text" id="description" placeholder="Description" /><br />
    <input type="text" id="lat" placeholder="Latitude" required />
    <input type="text" id="lng" placeholder="Longitude" required /><br />
    <button type="submit">Save</button>
  </form>

  <script>
    const token = localStorage.getItem('access_token');
    const form = document.getElementById('location-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);

      const res = await fetch('https://your-api.com/api/map/locations/', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name, description,
          coordinates: {
            type: "Point",
            coordinates: [lng, lat]
          }
        })
      });

      if (res.ok) {
        alert('✅ Location saved!');
        form.reset();
      } else {
        alert('❌ Failed to save location.');
      }
    });
  </script>
</body>
</html>
